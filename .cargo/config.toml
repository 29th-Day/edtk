[build]
target = "thumbv7em-none-eabi"

[target.thumbv7em-none-eabi]
rustflags = ["-C", "link-arg=-Tlink.x"]
runner = [
    "arm-none-eabi-gdb", "-q",
    "-ex", "target remote :3333",
    "-ex", "load",
    "-ex", "monitor machine Reset",
    "-ex", "maintenance flush register-cache",
    # "-ex", "set $sp = *(unsigned int*)0x08000000",
    # "-ex", "rbreak main$",
    # "-ex", 'rbreak ::main$\|__cortex_m_rt_main$',
    "-ex", "break *basics::main",
    # "-ex", "continue",
]
